# Full local stack: TimescaleDB (+pgvector) · Redis · API · worker · producer ·
# Prometheus · Grafana. Mirrors the free-tier cloud topology (Supabase/Upstash/
# Railway) — only connection strings differ.
#
#   docker compose up --build
#   open http://localhost:8000   (app)   http://localhost:3000 (grafana)

services:
  db:
    # -ha image bundles BOTH timescaledb and pgvector, so the app exercises its
    # full feature set locally (hypertables + ANN pose search).
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: wifipose
      POSTGRES_PASSWORD: wifipose
      POSTGRES_DB: wifipose
    ports: ["5432:5432"]
    volumes: ["pgdata:/home/postgres/pgdata/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wifipose"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      WIFIPOSE_DATABASE_URL: postgresql+asyncpg://wifipose:wifipose@db:5432/wifipose
      WIFIPOSE_REDIS_URL: redis://redis:6379/0
      WIFIPOSE_LLM_PROVIDER: ${WIFIPOSE_LLM_PROVIDER:-offline}
      WIFIPOSE_LLM_API_KEY: ${WIFIPOSE_LLM_API_KEY:-}
      WIFIPOSE_ENV: development
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    command: wifipose-consume
    environment:
      WIFIPOSE_DATABASE_URL: postgresql+asyncpg://wifipose:wifipose@db:5432/wifipose
      WIFIPOSE_REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      replicas: 2  # demonstrate horizontal scaling via Redis consumer groups

  producer:
    build: .
    command: wifipose-produce
    environment:
      WIFIPOSE_REDIS_URL: redis://redis:6379/0
      WIFIPOSE_PRODUCER_RATE_HZ: "8"
      WIFIPOSE_PRODUCER_SUBJECTS: "4"
    depends_on:
      redis: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
